[package]
name = "giga-m7"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "giga-m7"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m.workspace = true
cortex-m-rt.workspace = true
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
embassy-stm32 = { workspace = true, features = ["stm32h747xi-cm7"] }
giga-r1.workspace = true
panic-halt.workspace = true

[features]
default = ["defmt"]
defmt = ["dep:defmt", "dep:defmt-rtt", "embassy-stm32/defmt", "giga-r1/defmt"]

[lints]
workspace = true
