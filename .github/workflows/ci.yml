name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Metadata
        run: cargo metadata --no-deps --format-version 1

      - name: Install firmware build tools
        run: |
          cargo install flip-link --locked
          cargo install cargo-generate --locked

      - name: Format
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --workspace --target thumbv7em-none-eabihf --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --target thumbv7em-none-eabihf

      - name: Check all features
        run: cargo check --workspace --target thumbv7em-none-eabihf --all-features

      - name: Host tests
        run: |
          cargo test -p giga-r1 --features ipc,host-tests --test shared_queue --target x86_64-unknown-linux-gnu
          cargo test -p giga-r1 --features audio,host-tests --test audio_buffers --target x86_64-unknown-linux-gnu

      - name: Release build
        run: |
          cargo build --workspace --exclude dual-core-m4 --exclude dual-core-postcard-m4-worker --exclude dual-core-shared-queue-m4-worker --target thumbv7em-none-eabihf --release
          cargo build -p dual-core-m4 -p dual-core-postcard-m4-worker -p dual-core-shared-queue-m4-worker --target thumbv7em-none-eabihf --release

      - name: Template
        run: |
          cargo fmt --manifest-path template/Cargo.toml --all -- --check
          cargo build --manifest-path template/Cargo.toml -p giga-m4 --release
          cargo build --manifest-path template/Cargo.toml -p giga-m7 --release
          rm -rf /tmp/giga-template-smoke
          cargo generate --path template --name giga-template-smoke --destination /tmp
          cargo build --manifest-path /tmp/giga-template-smoke/Cargo.toml -p giga-m4 --release
          cargo build --manifest-path /tmp/giga-template-smoke/Cargo.toml -p giga-m7 --release

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p giga-r1 --target thumbv7em-none-eabihf --all-features --no-deps

      - name: Publish dry-run
        run: cargo publish -p giga-r1 --dry-run --allow-dirty --target thumbv7em-none-eabihf
